services:
  # 1. מסד הנתונים (PostgreSQL)
  db:
    image: postgres:15
    container_name: dating-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dating_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dating-network

  # 2. ה-Backend (FastAPI)
  backend:
    build: ./backend
    container_name: dating-backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dating_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - dating-network

  # 3. שרת ה-Web וה-Proxy (Nginx)
  web-server:
    build: ./nginx
    container_name: dating-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - dating-network
    depends_on:
      - backend

  # 4. ניטור מטריקות (Prometheus)
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - dating-network

  # 5. ויזואליזציה (Grafana)
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - dating-network
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

# הגדרת משאבים משותפים
networks:
  dating-network:
    driver: bridge

volumes:
  postgres_data: